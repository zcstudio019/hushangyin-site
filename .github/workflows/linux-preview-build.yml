name: Linux private preview release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'zcstudio019/hushangyin-site'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_URL: http://127.0.0.1:3120
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: ""
      SQLITE_DATABASE_URL: ""
      MYSQL_DATABASE_URL: ""
      TEST_DATABASE_URL: ""
      SESSION_SECRET: ""
      RATE_LIMIT_SECRET: ""
      AI_API_KEY: ""
      OPENAI_API_KEY: ""
      AI_GENERATION_ENABLED: "false"
      AI_EXTERNAL_TRANSMISSION_APPROVED: "false"
      GEO_WORKER_ENABLED: "false"
      CONSULTATIONS_ENABLED: "false"
      PRODUCTION_CONSULTATIONS_APPROVED: "false"
      ANALYTICS_ENABLED: "false"
      ANALYTICS_PRODUCTION_APPROVED: "false"
      MYSQL_PRODUCTION_APPROVED: "false"
      LOCAL_TEST_MODE: "false"
    steps:
      - name: Checkout without persistent Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up exact application Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.2"
          architecture: x64
          check-latest: false

      - name: Check clean source and disabled external services
        run: node deploy/ci/preflight.mjs

      - name: Test release filtering and symlink boundaries
        run: node --test deploy/ci/package.test.mjs

      - name: Install locked Linux dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build without database or production credentials
        run: npm run build

      - name: Package isolated Linux release
        id: package
        env:
          HSY_ARTIFACT_DIR: ${{ runner.temp }}/hushangyin-artifacts
        run: node deploy/ci/package-release.mjs

      - name: Verify extracted artifact and fail-closed runtime
        run: node deploy/ci/smoke-release.mjs '${{ steps.package.outputs.archive }}'

      - name: Upload downloadable release and SHA256
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hushangyin-preview-linux-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Build summary
        env:
          ARCHIVE_NAME: ${{ steps.package.outputs.filename }}
        run: |
          {
            echo '## 沪上银私有预发布构建完成'
            echo "发布包：\`$ARCHIVE_NAME\`，含 SHA256，保留 7 天。"
            echo 'Ubuntu 22.04 x64 / Node.js 24.22.2 / SITE_URL=http://127.0.0.1:3120'
            echo '未连接业务数据库，未部署 ECS，未执行迁移；下载后须另行人工验收。'
          } >> "$GITHUB_STEP_SUMMARY"
