# PRODUCTION TEMPLATE ONLY. Do not install/enable until DNS, TLS, ICP/business and existing sites are approved.
server {
    listen 80;
    server_name hushangyin.linhongtech.com;
    return 301 https://hushangyin.linhongtech.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name hushangyin.linhongtech.com;
    ssl_certificate /etc/letsencrypt/live/hushangyin.linhongtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hushangyin.linhongtech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 3m;
    client_body_timeout 15s;
    send_timeout 30s;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    access_log /var/log/nginx/hushangyin-access.log hsy_safe;
    error_log /var/log/nginx/hushangyin-error.log warn;
    location = /api/health/ { allow 127.0.0.1; allow ::1; deny all; proxy_pass http://127.0.0.1:3120; }
    location ~* ^/(?:\.git|\.env|prisma|node_modules|backups|\.local-postgres)(?:/|$) { return 404; }
    location ~* \.(?:sqlite|sqlite3|db|aes)(?:$|/) { return 404; }
    location = /api/admin/login/ { limit_req zone=hsy_login burst=5 nodelay; client_max_body_size 16k; include /etc/nginx/snippets/hushangyin-proxy.conf; }
    location = /api/consultations/ { limit_req zone=hsy_consult burst=5 nodelay; client_max_body_size 16k; include /etc/nginx/snippets/hushangyin-proxy.conf; }
    location / { include /etc/nginx/snippets/hushangyin-proxy.conf; }
}
