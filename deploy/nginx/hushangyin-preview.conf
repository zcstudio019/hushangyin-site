# Optional loopback pre-release proxy. No public listener, no DNS or certificate required.
server {
    listen 127.0.0.1:8086;
    server_name hushangyin.linhongtech.com;
    client_max_body_size 3m;
    access_log /var/log/nginx/hushangyin-preview.log hsy_safe;
    location / { include /etc/nginx/snippets/hushangyin-proxy.conf; }
}
