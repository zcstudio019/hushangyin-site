name: Linux release build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release purpose
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: linux-preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'zcstudio019/hushangyin-site'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout without persistent Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build and verify release in isolated Ubuntu 22.04 containers
        id: package
        env:
          HSY_RELEASE_MODE: ${{ inputs.mode }}
        run: |
          git archive --format=tar --output="$RUNNER_TEMP/hsy-source.tar" HEAD
          bash deploy/ci/build-linux-preview.sh "$RUNNER_TEMP/hsy-source.tar" "$RUNNER_TEMP/hushangyin-artifacts"

      - name: Upload downloadable release and SHA256
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hushangyin-${{ inputs.mode }}-linux-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Build summary
        env:
          ARCHIVE_NAME: ${{ steps.package.outputs.filename }}
        run: |
          {
            echo '## 沪上银 Linux 发布包构建完成'
            echo "发布包：\`$ARCHIVE_NAME\`，含 SHA256，保留 7 天。"
            echo 'Ubuntu 22.04 x64 / Node.js 24.22.2'
            echo '只读包以普通用户完成离线Prisma验证和一次性SQLite迁移测试；未操作业务数据库或ECS。'
          } >> "$GITHUB_STEP_SUMMARY"
