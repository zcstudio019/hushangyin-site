# HTTP-context include only. New unique names; never replace nginx.conf.
limit_req_zone $binary_remote_addr zone=hsy_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hsy_consult:1m rate=5r/m;
# No IP, query string, referrer, user agent, Cookie or Authorization in this log.
log_format hsy_safe escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
